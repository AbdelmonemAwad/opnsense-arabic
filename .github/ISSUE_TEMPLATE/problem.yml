name: Something does not work
description: The arabic translation does not do what it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Take out addresses, MAC addresses, serial numbers and host names before pasting, and never attach a configuration backup.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version installed, and the OPNsense version.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, if you know them. "It happened once" is an answer too.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The lines around the time, cleaned first.
      render: text
